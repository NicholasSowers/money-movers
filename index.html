<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sowers Money Movers</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #0f0f12; color: #e8e8e8; font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 50px; }
    .hero { padding: 30px; background: #12121a; border-bottom: 1px solid #2a2a3a; text-align: center; }
    .status { font-size: 11px; font-weight: bold; margin-top: 10px; text-transform: uppercase; color: #f5a623; letter-spacing: 1px; }
    .tabs { display: flex; justify-content: center; background: #12121a; border-bottom: 1px solid #2a2a3a; position: sticky; top: 0; z-index: 10; }
    .tab { padding: 15px 25px; cursor: pointer; color: #666; font-weight: bold; transition: 0.3s; }
    .tab.active { color: #f5a623; border-bottom: 3px solid #f5a623; }
    .container { padding: 20px; max-width: 800px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #161620; padding: 20px; border-radius: 15px; border: 1px solid #2a2a3a; text-align: center; }
    .stat-label { font-size: 10px; color: #555; text-transform: uppercase; font-weight: 800; margin-bottom: 5px; }
    .stat-value { font-size: 24px; font-weight: 900; margin-top: 5px; }
    .donut-ring { width: 70px; height: 70px; margin: 10px auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
    .search-box { width: 100%; padding: 12px; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; }
    .day-btns { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .btn { padding: 8px 18px; border-radius: 20px; background: #1a1a2e; color: #888; border: 1px solid #333; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn.active { background: #f5a623; color: #000; border-color: #f5a623; }
    table { width: 100%; border-collapse: collapse; background: #161620; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a3a; }
    th { text-align: left; padding: 12px; background: #1e1e2e; color: #555; font-size: 10px; text-transform: uppercase; }
    td { padding: 15px 12px; border-bottom: 1px solid #2a2a3a; font-size: 14px; }
    .ticker { font-weight: 900; color: #fff; }
    .pos { color: #3ecf72; } .neg { color: #e85555; }
    select { width: 100%; padding: 15px; background: #1a1a2e; color: #fff; border: 1px solid #f5a623; border-radius: 8px; font-size: 16px; margin-bottom: 15px; font-weight: bold; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSiQr7KUQ0hfV0QKHqYeZNpgGgZW1fPxvz_VbWV4BLqMUcVqeNI29O_OnsEzUWS9DKsMRpSIwd20Uj06PD33bGryggeDNPOkyVaUgRN7v5f2Ibsj8oaEM0vhGImF7E-6DOy21rAudjmt5igpcjaP0NU-Gis4DcDcHzKwoXsJJjGgdM43wBx6uUMrk2SOndmOKfYXg2zHgDgnDLdCFC1EuO2MV_yiXswjsNGjLaKoX9T3q-tpMI57Pw2FMHXq-U26nHQluBO0pekVdiq71G4qtcsMfiyWA&lib=Mc8J5LkGbnziwF7xKoyE4nfdCw1vWoYPm";

function App() {
  const [data, setData] = useState([]);
  const [dates, setDates] = useState([]);
  const [selectedDate, setSelectedDate] = useState('');
  const [dayIdx, setDayIdx] = useState(0);
  const [search, setSearch] = useState('');
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('tracker');

  useEffect(() => {
    fetch(SCRIPT_URL).then(res => res.text()).then(text => {
      const rows = text.trim().split(/\r?\n/).map(line => 
        line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim())
      );
      const parsed = rows.slice(1).map(r => ({
        date: r[0], ticker: r[1], rank: parseInt(r[13]) || 0,
        growths: [parseFloat(r[17])||0, parseFloat(r[21])||0, parseFloat(r[25])||0, parseFloat(r[29])||0, parseFloat(r[33])||0]
      }));
      const uniqueDates = [...new Set(parsed.map(r => r.date))].filter(Boolean).reverse();
      setData(parsed);
      setDates(uniqueDates);
      if (uniqueDates.length > 0) setSelectedDate(uniqueDates[0]);
      setLoading(false);
    });
  }, []);

  const historyStats = useMemo(() => {
    let qWin = 0, qTotal = 0, nqWin = 0, nqTotal = 0, wins = 0, losses = 0;

    dates.forEach(d => {
      const dayData = data.filter(r => r.date === d);
      const ranked = dayData.filter(r => r.rank > 0);
      const unranked = dayData.filter(r => r.rank === 0);

      // Qualified Success (Ignore 0.00% as no data)
      ranked.forEach(r => {
        if (r.growths[dayIdx] !== 0) {
          qTotal++;
          if (r.growths[dayIdx] > 0) qWin++;
        }
      });

      // Non-Qualified Success
      unranked.forEach(r => {
        if (r.growths[dayIdx] !== 0) {
          nqTotal++;
          if (r.growths[dayIdx] > 0) nqWin++;
        }
      });

      // Record logic (Win if ranked avg > 0, Loss if < 0. Skip if exactly 0)
      const validRanked = ranked.filter(r => r.growths[dayIdx] !== 0);
      if (validRanked.length > 0) {
        const avg = validRanked.reduce((s, r) => s + r.growths[dayIdx], 0) / validRanked.length;
        if (avg > 0) wins++;
        else if (avg < 0) losses++;
      }
    });

    return {
      qRate: qTotal ? Math.round((qWin/qTotal)*100) : 0,
      nqRate: nqTotal ? Math.round((nqWin/nqTotal)*100) : 0,
      record: `${wins}-${losses}`
    };
  }, [data, dates, dayIdx]);

  const allForDate = useMemo(() => data.filter(r => r.date === selectedDate), [data, selectedDate]);
  const rankedPicks = useMemo(() => allForDate.filter(r => r.rank > 0).sort((a,b) => a.rank - b.rank), [allForDate]);
  const searchResults = useMemo(() => 
    allForDate.filter(r => r.ticker.toLowerCase().includes(search.toLowerCase())), 
  [allForDate, search]);

  if (loading) return <div className="hero"><h1>Sowers Money Movers</h1><div className="status">SYNCING...</div></div>;

  return (
    <div>
      <div className="hero">
        <h1>Sowers Money Movers</h1>
        <div className="status">{selectedDate} Analysis</div>
      </div>

      <div className="tabs">
        <div className={`tab ${view === 'tracker' ? 'active' : ''}`} onClick={() => setView('tracker')}>TRACKER</div>
        <div className={`tab ${view === 'history' ? 'active' : ''}`} onClick={() => setView('history')}>RECORD</div>
        <div className={`tab ${view === 'settings' ? 'active' : ''}`} onClick={() => setView('settings')}>CONFIG</div>
      </div>

      <div className="container">
        <div className="day-btns">
            {['Mon','Tue','Wed','Thu','Fri'].map((d, i) => (
              <button key={d} className={`btn ${dayIdx === i ? 'active' : ''}`} onClick={() => setDayIdx(i)}>{d}</button>
            ))}
        </div>

        {view === 'history' ? (
          <div>
            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-label">Qualified Success</div>
                <div className="donut-ring" style={{background: `conic-gradient(#3ecf72 ${historyStats.qRate}%, #222 0)`}}>
                  <div style={{background:'#161620', width:'80%', height:'80%', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center'}}>
                    {historyStats.qRate}%
                  </div>
                </div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Non-Qualified</div>
                <div className="donut-ring" style={{background: `conic-gradient(#555 ${historyStats.nqRate}%, #222 0)`}}>
                  <div style={{background:'#161620', width:'80%', height:'80%', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center'}}>
                    {historyStats.nqRate}%
                  </div>
                </div>
              </div>
            </div>
            <div className="stat-card" style={{marginBottom:'20px'}}>
               <div className="stat-label">Model Record (W-L)</div>
               <div className="stat-value" style={{color:'#f5a623'}}>{historyStats.record}</div>
            </div>

            <input className="search-box" placeholder="Search ticker history..." value={search} onChange={e => setSearch(e.target.value)} />
            <table>
              <thead><tr><th>Ticker</th><th style={{textAlign:'right'}}>Growth</th></tr></thead>
              <tbody>
                {searchResults.map((s, i) => (
                  <tr key={i}><td className="ticker">{s.ticker}</td><td style={{textAlign:'right'}} className={s.growths[dayIdx] >= 0 ? 'pos' : 'neg'}>{s.growths[dayIdx].toFixed(2)}%</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : view === 'settings' ? (
          <div>
            <h3>Switch Analysis Date</h3>
            <select value={selectedDate} onChange={e => setSelectedDate(e.target.value)}>{dates.map(d => <option key={d}>{d}</option>)}</select>
          </div>
        ) : (
          <table>
            <thead><tr><th>Rank</th><th>Ticker</th><th style={{textAlign:'right'}}>Growth</th></tr></thead>
            <tbody>
              {rankedPicks.map((s, i) => (
                <tr key={i}>
                  <td style={{color:'#f5a623', fontWeight:'bold'}}>#{s.rank}</td>
                  <td className="ticker">{s.ticker}</td>
                  <td style={{textAlign:'right'}} className={s.growths[dayIdx] >= 0 ? 'pos' : 'neg'}>{s.growths[dayIdx].toFixed(2)}%</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
