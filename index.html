<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sowers Money Movers</title>
  <!-- Google Font: JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f0f12; --panel: #161620; --panel-alt: #1a1a2e; --line: #2a2a3a;
      --gold: #f5a623; --gold-soft: rgba(245,166,35,0.12);
      --up: #3ecf72; --down: #e85555; --muted: #777;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: #e8e8e8; font-family: 'JetBrains Mono', monospace; margin: 0; padding-bottom: 20px; }

    .hero { padding: 28px 20px; background: #12121a; border-bottom: 1px solid var(--line); text-align: center; position: relative; }
    .logo { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); height: 44px; width: 44px; object-fit: contain; border-radius: 8px; }
    .hero h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
    .status { font-size: 11px; font-weight: 700; margin-top: 8px; color: var(--gold); letter-spacing: 1px; }

    .tabs { display: flex; justify-content: center; background: #12121a; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .tab { padding: 14px 22px; cursor: pointer; color: #666; font-weight: 700; font-size: 13px; transition: color 0.2s, border-color 0.2s; border-bottom: 3px solid transparent; }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
    .tab:hover:not(.active) { color: #aaa; }

    .container { padding: 18px; max-width: 1000px; margin: 0 auto; min-height: calc(100vh - 250px); }
    .view-fade { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .stats-header-banner { background: #1a1a2e; border: 1px solid #333; padding: 11px; border-radius: 8px; text-align: center; margin-bottom: 14px; font-weight: 800; font-size: 11px; color: var(--gold); letter-spacing: 1px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
    .stat-card { background: var(--panel); padding: 18px 10px; border-radius: 14px; border: 1px solid var(--line); text-align: center; }
    .stat-label { font-size: 10px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
    .stat-value { font-size: 17px; font-weight: 800; margin-top: 8px; color: var(--gold); }
    .donut-ring { width: 64px; height: 64px; margin: 8px auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }

    .search-box { width: 100%; padding: 12px; background: var(--panel-alt); border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 14px; box-sizing: border-box; font-size: 14px; font-family: 'JetBrains Mono', monospace; }
    .search-box:focus { outline: none; border-color: var(--gold); }

    .day-btns { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 4px; }
    .btn { padding: 8px 16px; border-radius: 20px; background: var(--panel-alt); color: #888; border: 1px solid #333; cursor: pointer; font-weight: 700; font-size: 12px; font-family: 'JetBrains Mono', monospace; transition: 0.15s; flex-shrink: 0; }
    .btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .btn:hover:not(.active) { border-color: #555; color: #bbb; }

    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 22px; }
    th { text-align: left; padding: 11px 12px; background: #1e1e2e; color: #666; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 13px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
    tr:last-child td { border-bottom: none; }
    .ticker { font-weight: 800; color: #fff; cursor: pointer; text-decoration: underline; text-decoration-color: #444; text-underline-offset: 4px; transition: 0.15s; }
    .ticker:hover { color: var(--gold); text-decoration-color: var(--gold); }

    .gold-ticker {
      background: linear-gradient(135deg, #ffd700, var(--gold));
      color: #000 !important; font-weight: 800; padding: 3px 8px; border-radius: 4px;
      display: inline-block; box-shadow: 0 0 10px rgba(255, 215, 0, 0.35); text-decoration: none !important;
    }

    .score-cell { font-weight: 700; color: var(--gold); }
    .price-cell { font-weight: 700; color: #e8e8e8; }
    .pending { color: #666; font-style: italic; font-weight: 600; font-size: 12px; }
    .section-header { color: var(--gold); font-size: 13px; font-weight: 800; margin: 22px 0 10px 0; }
    .pos { color: var(--up); } .neg { color: var(--down); } .neutral { color: #888; }
    select { width: 100%; padding: 14px; background: var(--panel-alt); color: #fff; border: 1px solid var(--gold); border-radius: 8px; font-size: 15px; margin-bottom: 14px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    footer { text-align: center; color: #555; font-size: 11px; padding: 20px; border-top: 1px solid #1e1e2e; margin-top: 36px; line-height: 1.7; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(3px); animation: fadeIn 0.15s ease; }
    .modal-content { background: var(--panel); border: 2px solid var(--gold); border-radius: 12px; padding: 20px; width: 90%; max-width: 440px; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .modal-header h2 { margin: 0; color: #fff; font-size: 19px; }

    .breakdown-box { background: var(--panel-alt); border: 1px solid #333; border-radius: 10px; padding: 13px; margin-bottom: 14px; }
    .breakdown-label { font-size: 10px; color: var(--gold); font-weight: 800; letter-spacing: 0.5px; margin-bottom: 6px; }
    .breakdown-text { font-size: 13px; line-height: 1.65; color: #ccc; }

    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-item { background: var(--panel-alt); padding: 10px; border-radius: 8px; border: 1px solid var(--line); text-align: center; }
    .modal-label { font-size: 9px; color: #888; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
    .modal-val { font-size: 14px; font-weight: 700; color: var(--gold); }

    /* Chat tab */
    .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 260px); min-height: 420px; }
    .chat-disclaimer { font-size: 11px; color: var(--muted); background: var(--panel-alt); border: 1px solid #333; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px 2px; }
    .chat-empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 30px; }
    .chat-bubble { max-width: 80%; padding: 10px 13px; border-radius: 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .chat-bubble.user { align-self: flex-end; background: var(--gold-soft); border: 1px solid var(--gold); color: #fff; }
    .chat-bubble.bot { align-self: flex-start; background: var(--panel-alt); border: 1px solid #333; color: #ddd; }
    .chat-loading { color: var(--muted); font-style: italic; }
    .chat-input-row { display: flex; gap: 8px; align-items: center; }
    .chat-input { margin-bottom: 0 !important; }
    .chat-send { flex-shrink: 0; padding: 12px 20px; }

    @media (max-width: 850px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr; }
      .logo { position: static; transform: none; margin: 0 auto 10px auto; display: block; }
      .hero { text-align: center; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSkJGrxSTkCk88LMTiTgSRmvP_tf37HyeZWnsXl3sKNF9ESDdmUp1R9vCODEqej6qcXw/exec";

// The Chat tab posts { query } here and expects back { text }.
// This CANNOT point directly at api.anthropic.com from a page hosted on
// GitHub Pages (or anywhere outside Claude's own artifact preview) — that
// would require embedding a secret API key in public page source, which
// anyone viewing "View Source" could copy and spend against your account.
// Point this at a small backend you control instead (serverless function,
// etc.) that holds the key server-side. See chat-worker-example.js.
const CHAT_API_URL = "https://YOUR-BACKEND-ENDPOINT-HERE";

// Sorts by Model Score (BW) descending, pushing rows with no recorded
// score to the bottom instead of mixing them in at an implied 0.
const byScoreDesc = (a, b) => {
  if (a.hasScore && b.hasScore) return b.score - a.score;
  if (a.hasScore) return -1;
  if (b.hasScore) return 1;
  return 0;
};

// Builds a short, plain-English read of a ticker using only the metrics
// already recorded in the sheet (RSI, target upside, PEG, FCF yield, volume,
// forest-model check). This is not a prediction and doesn't assign a grade —
// it just translates the numbers that already exist into a sentence or two.
function buildBreakdown(details) {
  const lines = [];

  const rsi = parseFloat(details.rsi);
  if (!isNaN(rsi)) {
    if (rsi >= 70) lines.push(`RSI is at ${rsi}, in overbought territory.`);
    else if (rsi <= 30) lines.push(`RSI is at ${rsi}, in oversold territory.`);
    else lines.push(`RSI is at ${rsi}, a neutral reading.`);
  }

  const upside = parseFloat(details.targetUpside);
  if (!isNaN(upside)) {
    lines.push(`Recorded analyst target upside is ${upside > 0 ? '+' : ''}${upside}%.`);
  }

  const peg = parseFloat(details.pegRatio);
  if (!isNaN(peg)) {
    if (peg < 1) lines.push(`PEG of ${peg} is on the cheap side relative to growth.`);
    else if (peg > 2) lines.push(`PEG of ${peg} is rich relative to growth.`);
    else lines.push(`PEG of ${peg} is roughly in line with growth.`);
  }

  const fcf = parseFloat(details.fcfYield);
  if (!isNaN(fcf)) lines.push(`FCF yield is ${fcf}%.`);

  if (details.volSpike && details.volSpike !== '--') lines.push(`Volume: ${details.volSpike}.`);
  if (details.forestVerified && details.forestVerified !== '--') lines.push(`Forest-model check: ${details.forestVerified}.`);

  return lines.length ? lines.join(' ') : "No recorded metrics yet for this ticker.";
}

function App() {
  const [data, setData] = useState([]);
  const [dates, setDates] = useState([]);
  const [selectedDate, setSelectedDate] = useState('');
  const [dayIdx, setDayIdx] = useState(0);
  const [search, setSearch] = useState('');
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('tracker');
  const [selectedStock, setSelectedStock] = useState(null);
  const [chatMessages, setChatMessages] = useState([]);
  const [chatInput, setChatInput] = useState('');
  const [chatLoading, setChatLoading] = useState(false);

  useEffect(() => {
    fetch(SCRIPT_URL)
      .then(res => res.text())
      .then(text => {
        const cleanText = text.trim();
        if (cleanText.startsWith("Error:") || cleanText.startsWith("<")) {
          throw new Error("Invalid CSV data received from Apps Script. Verify Google Sheet URL.");
        }

        const rows = cleanText.split(/\r?\n/).map(line =>
          line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim())
        );

        const parsed = rows.slice(1).map(r => {
          // Column BF is index 57
          const rawWin = r[57] ? r[57].replace(/[^0-9.]/g, '') : '';
          let winStatus = null;
          if (rawWin === '1' || rawWin === '1.0' || rawWin === '100') {
            winStatus = 1;
          } else if (rawWin === '0' || rawWin === '0.0') {
            winStatus = 0;
          }

          // Grade extraction: BK = 62, BJ = 61, BL = 63, BM = 64
          const gptGrade = r[62] ? r[62].trim() : '--';
          const claudeGrade = r[61] ? r[61].trim() : '--';
          const sowgorithmGrade = r[63] ? r[63].trim() : '--';
          const weekPrior = r[64] ? r[64].trim() : '--';

          // Check if grade is A or A-
          const isGoldGrade = (val) => {
            if (!val) return false;
            const norm = val.trim().toUpperCase();
            return norm === 'A' || norm === 'A-';
          };

          const isTripleA = isGoldGrade(gptGrade) && isGoldGrade(claudeGrade) && isGoldGrade(sowgorithmGrade);

          // Column BW (Index 74) Model Score — tracked honestly: if the
          // pipeline hasn't produced a score yet, we keep that as "no score"
          // rather than defaulting to 0, which would display as a real
          // (and misleadingly bad) number.
          const rawScore = r[74] !== undefined ? String(r[74]).trim() : '';
          const parsedScore = parseFloat(rawScore);
          const hasScore = rawScore !== '' && !isNaN(parsedScore);

          return {
            date: r[0] ? r[0].trim() : '',
            ticker: r[1] || '',
            score: hasScore ? parsedScore : null,
            hasScore,
            winVal: winStatus,
            isTripleA: isTripleA,
            prices: [
              parseFloat(r[14]) || 0, parseFloat(r[16]) || 0, parseFloat(r[20]) || 0,
              parseFloat(r[24]) || 0, parseFloat(r[28]) || 0, parseFloat(r[32]) || 0
            ],
            growths: [
              parseFloat(r[15]) || 0, parseFloat(r[17]) || 0, parseFloat(r[21]) || 0,
              parseFloat(r[25]) || 0, parseFloat(r[29]) || 0, parseFloat(r[33]) || 0
            ],
            details: {
              gptGrade: gptGrade,
              claudeGrade: claudeGrade,
              sowgorithmGrade: sowgorithmGrade,
              weekPrior: weekPrior,
              rsi: r[43] || '--',            // AR
              volSpike: r[44] || '--',       // AS
              targetUpside: r[51] || '--',   // AZ
              relStrength: r[52] || '--',    // BA
              fcfYield: r[53] || '--',       // BB
              peRatio: r[55] || '--',        // BD
              pegRatio: r[56] || '--',       // BE
              forestVerified: r[58] || '--'  // BG
            }
          };
        });

        const uniqueDates = [...new Set(parsed.map(r => r.date))].filter(Boolean).reverse();
        setData(parsed);
        setDates(uniqueDates);
        if (uniqueDates.length > 0) setSelectedDate(uniqueDates[0]);
      })
      .catch(err => {
        console.error("Fetch failure:", err);
        alert(err.message);
      })
      .finally(() => setLoading(false));
  }, []);

  const rankedAllForDate = useMemo(() => {
    const dayData = data.filter(r => r.date === selectedDate);
    return [...dayData].sort(byScoreDesc).map((item, idx) => ({
      ...item,
      rank: idx + 1
    }));
  }, [data, selectedDate]);

  const top25 = useMemo(() => rankedAllForDate.slice(0, 25), [rankedAllForDate]);
  const bottom25 = useMemo(() => [...rankedAllForDate].reverse().slice(0, 25), [rankedAllForDate]);

  const searchResults = useMemo(() => {
    return rankedAllForDate
      .filter(r => r.ticker.toLowerCase().includes(search.toLowerCase()))
      .map(s => {
        const entryP = s.prices[0];
        const friP = s.prices[5];
        let netReturn = 0;
        let hasData = false;

        if (entryP > 0 && friP > 0) {
          netReturn = ((friP - entryP) / entryP) * 100;
          hasData = true;
        }
        return { ...s, netReturn, hasData };
      });
  }, [rankedAllForDate, search]);

  // Sends a question to your backend and expects { text } back. This is
  // background/news context only — the backend prompt (see
  // chat-worker-example.js) explicitly tells the model not to return a
  // letter grade, score, or buy/sell recommendation.
  const sendChatMessage = async () => {
    const query = chatInput.trim();
    if (!query || chatLoading) return;
    setChatMessages(prev => [...prev, { role: 'user', text: query }]);
    setChatInput('');
    setChatLoading(true);
    try {
      const res = await fetch(CHAT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      if (!res.ok) throw new Error(`Backend returned ${res.status}`);
      const json = await res.json();
      setChatMessages(prev => [...prev, { role: 'bot', text: json.text || "No background found for that." }]);
    } catch (err) {
      setChatMessages(prev => [...prev, { role: 'bot', text: `Couldn't reach the background service (${err.message}). Set CHAT_API_URL to your deployed backend.` }]);
    } finally {
      setChatLoading(false);
    }
  };

  if (loading) return <div className="hero"><h1>Sowers Money Movers</h1><div className="status">SYNCING...</div></div>;

  const ScoreCell = ({ s }) => s.hasScore
    ? <td className="score-cell">{s.score.toFixed(2)}</td>
    : <td><span className="pending">Pending</span></td>;

  return (
    <div>
      <div className="hero">
        <img src="logo.png" alt="Money Movers Logo" className="logo" />
        <h1>Sowers Money Movers</h1>
        <div className="status">{selectedDate} ANALYSIS</div>
      </div>

      <div className="tabs">
        <div className={`tab ${view === 'tracker' ? 'active' : ''}`} onClick={() => setView('tracker')}>TRACKER</div>
        <div className={`tab ${view === 'history' ? 'active' : ''}`} onClick={() => setView('history')}>RECORD</div>
        <div className={`tab ${view === 'search' ? 'active' : ''}`} onClick={() => setView('search')}>SEARCH</div>
        <div className={`tab ${view === 'chat' ? 'active' : ''}`} onClick={() => setView('chat')}>CHAT</div>
        <div className={`tab ${view === 'settings' ? 'active' : ''}`} onClick={() => setView('settings')}>CONFIG</div>
      </div>

      <div className="container view-fade" key={view}>

        {view === 'tracker' && (
          <div className="day-btns">
              {['Entry', 'Mon','Tue','Wed','Thu','Fri'].map((d, i) => (
                <button key={d} className={`btn ${dayIdx === i ? 'active' : ''}`} onClick={() => setDayIdx(i)}>{d}</button>
              ))}
          </div>
        )}

        {view === 'history' ? (
          <div>
            <div className="section-header">Top 25 Performers (Column BF Win %)</div>
            <table>
              <thead>
                <tr>
                  <th>Ticker</th>
                  <th>Rank</th>
                  <th>Model Score (BW)</th>
                  <th>Entry</th>
                  <th>Finished</th>
                  <th style={{textAlign:'right'}}>Weekly Win</th>
                </tr>
              </thead>
              <tbody>
                {top25.map((s, i) => (
                  <tr key={i}>
                    <td>
                      <span className={s.isTripleA ? "ticker gold-ticker" : "ticker"} onClick={() => setSelectedStock(s)}>
                        {s.ticker}
                      </span>
                    </td>
                    <td style={{fontSize: '12px', color: '#888'}}>#{s.rank}</td>
                    <ScoreCell s={s} />
                    <td className="price-cell">{s.prices[0] ? `$${s.prices[0].toFixed(2)}` : '--'}</td>
                    <td className="price-cell">{s.prices[5] ? `$${s.prices[5].toFixed(2)}` : '--'}</td>
                    <td style={{textAlign:'right'}} className={s.winVal === 1 ? 'pos' : s.winVal === 0 ? 'neg' : 'neutral'}>
                      {s.winVal === 1 ? 'WIN (1)' : s.winVal === 0 ? 'LOSS (0)' : '--'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="section-header">Bottom 25 Performers (Column BF Win %)</div>
            <table>
              <thead>
                <tr>
                  <th>Ticker</th>
                  <th>Rank</th>
                  <th>Model Score (BW)</th>
                  <th>Entry</th>
                  <th>Finished</th>
                  <th style={{textAlign:'right'}}>Weekly Win</th>
                </tr>
              </thead>
              <tbody>
                {bottom25.map((s, i) => (
                  <tr key={i}>
                    <td>
                      <span className={s.isTripleA ? "ticker gold-ticker" : "ticker"} onClick={() => setSelectedStock(s)}>
                        {s.ticker}
                      </span>
                    </td>
                    <td style={{fontSize: '12px', color: '#888'}}>#{s.rank}</td>
                    <ScoreCell s={s} />
                    <td className="price-cell">{s.prices[0] ? `$${s.prices[0].toFixed(2)}` : '--'}</td>
                    <td className="price-cell">{s.prices[5] ? `$${s.prices[5].toFixed(2)}` : '--'}</td>
                    <td style={{textAlign:'right'}} className={s.winVal === 1 ? 'pos' : s.winVal === 0 ? 'neg' : 'neutral'}>
                      {s.winVal === 1 ? 'WIN (1)' : s.winVal === 0 ? 'LOSS (0)' : '--'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : view === 'search' ? (
          <div>
            <input className="search-box" placeholder="Search ticker history..." value={search} onChange={e => setSearch(e.target.value)} />
            <table>
              <thead>
                <tr>
                  <th>Ticker</th>
                  <th>Category</th>
                  <th style={{textAlign:'right'}}>Weekly Net</th>
                </tr>
              </thead>
              <tbody>
                {searchResults.map((s, i) => (
                  <tr key={i}>
                    <td>
                      <span className={s.isTripleA ? "ticker gold-ticker" : "ticker"} onClick={() => setSelectedStock(s)}>
                        {s.ticker}
                      </span>
                    </td>
                    <td style={{fontSize: '12px', color: '#888'}}>Ranked #{s.rank}</td>
                    <td style={{textAlign:'right'}} className={!s.hasData ? 'neutral' : s.netReturn >= 0 ? 'pos' : 'neg'}>
                      {s.hasData ? `${s.netReturn.toFixed(2)}%` : '--'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : view === 'chat' ? (
          <div className="chat-wrap">
            <div className="chat-disclaimer">
              Background and recent news context only — not a grade, score, or recommendation.
            </div>
            <div className="chat-messages">
              {chatMessages.length === 0 && !chatLoading && (
                <div className="chat-empty">Ask about a ticker — e.g. "What's going on with AAPL lately?"</div>
              )}
              {chatMessages.map((m, i) => (
                <div key={i} className={`chat-bubble ${m.role}`}>{m.text}</div>
              ))}
              {chatLoading && <div className="chat-bubble bot chat-loading">Looking this up…</div>}
            </div>
            <div className="chat-input-row">
              <input
                className="search-box chat-input"
                placeholder="Ask about a ticker..."
                value={chatInput}
                onChange={e => setChatInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && sendChatMessage()}
              />
              <button className="btn active chat-send" onClick={sendChatMessage} disabled={chatLoading}>Send</button>
            </div>
          </div>
        ) : view === 'settings' ? (
          <div>
            <h3 style={{marginTop: 0}}>Configuration</h3>
            <div style={{marginBottom: '20px'}}>
              <label style={{fontSize: '12px', color: '#888', fontWeight: 'bold', display: 'block', marginBottom: '8px'}}>
                SWITCH ANALYSIS DATE
              </label>
              <select value={selectedDate} onChange={e => setSelectedDate(e.target.value)}>
                {dates.map((d) => (
                  <option key={d} value={d}>
                    {d} {d === dates[0] ? '(Most Recent)' : ''}
                  </option>
                ))}
              </select>
            </div>

            {/* Most Recent Stock Analysis Breakdown */}
            {dates.length > 0 && (() => {
              const latestDate = dates[0];
              const latestStocks = data.filter(r => r.date === latestDate).sort(byScoreDesc);
              const tripleACount = latestStocks.filter(s => s.isTripleA).length;

              return (
                <div>
                  <div className="stats-header-banner" style={{marginTop: '25px'}}>
                    MOST RECENT STOCK ANALYSIS ({latestDate})
                  </div>

                  <div className="stats-grid" style={{gridTemplateColumns: 'repeat(3, 1fr)'}}>
                    <div className="stat-card">
                      <div className="stat-label">Analysis Date</div>
                      <div className="stat-value" style={{fontSize: '15px'}}>{latestDate}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Total Analyzed</div>
                      <div className="stat-value">{latestStocks.length} Stocks</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Triple-A Rated</div>
                      <div className="stat-value" style={{color: '#ffd700'}}>{tripleACount} Tickers</div>
                    </div>
                  </div>

                  <div className="section-header">Most Recent Stock Analysis Breakdown</div>
                  <table>
                    <thead>
                      <tr>
                        <th>Rank</th>
                        <th>Ticker</th>
                        <th>Model Score</th>
                        <th>Entry Price</th>
                        <th>GPT Grade</th>
                        <th>Claude Grade</th>
                        <th>Sowgorithm</th>
                      </tr>
                    </thead>
                    <tbody>
                      {latestStocks.map((s, idx) => (
                        <tr key={s.ticker + idx}>
                          <td style={{color: '#f5a623', fontWeight: 'bold'}}>#{idx + 1}</td>
                          <td>
                            <span className={s.isTripleA ? "ticker gold-ticker" : "ticker"} onClick={() => setSelectedStock({...s, rank: idx + 1})}>
                              {s.ticker}
                            </span>
                          </td>
                          <ScoreCell s={s} />
                          <td className="price-cell">{s.prices[0] ? `$${s.prices[0].toFixed(2)}` : '--'}</td>
                          <td style={{fontWeight: 'bold', color: '#fff'}}>{s.details.gptGrade}</td>
                          <td style={{fontWeight: 'bold', color: '#fff'}}>{s.details.claudeGrade}</td>
                          <td style={{fontWeight: 'bold', color: '#fff'}}>{s.details.sowgorithmGrade}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              );
            })()}
          </div>
        ) : (
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Ticker</th>
                <th>Model Score</th>
                <th>Price</th>
                {dayIdx !== 0 && <th style={{textAlign:'right'}}>Growth</th>}
              </tr>
            </thead>
            <tbody>
              {rankedAllForDate.map((s) => (
                <tr key={s.ticker}>
                  <td style={{color:'#f5a623', fontWeight:'bold'}}>#{s.rank}</td>
                  <td>
                    <span className={s.isTripleA ? "ticker gold-ticker" : "ticker"} onClick={() => setSelectedStock(s)}>
                      {s.ticker}
                    </span>
                  </td>
                  <ScoreCell s={s} />
                  <td className="price-cell">{s.prices[dayIdx] ? `$${s.prices[dayIdx].toFixed(2)}` : '--'}</td>
                  {dayIdx !== 0 && (
                    <td style={{textAlign:'right'}} className={s.growths[dayIdx] >= 0 ? 'pos' : 'neg'}>
                      {s.growths[dayIdx].toFixed(2)}%
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        )}

        {/* Modal Overlay with Full Metric Breakdown */}
        {selectedStock && (
          <div className="modal-overlay" onClick={() => setSelectedStock(null)}>
            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
              <div className="modal-header">
                <h2>{selectedStock.ticker} <span style={{fontSize: '14px', color: '#888'}}>Rank #{selectedStock.rank}</span></h2>
              </div>

              <div className="breakdown-box">
                <div className="breakdown-label">Quick Read (from recorded metrics)</div>
                <div className="breakdown-text">{buildBreakdown(selectedStock.details)}</div>
              </div>

              <div className="modal-grid">
                <div className="modal-item">
                  <div className="modal-label">GPT Letter Grade</div>
                  <div className="modal-val">{selectedStock.details.gptGrade}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">Claude Letter Grade</div>
                  <div className="modal-val">{selectedStock.details.claudeGrade}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">Sowgorithm Grade</div>
                  <div className="modal-val">{selectedStock.details.sowgorithmGrade}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">Week Prior</div>
                  <div className="modal-val">{selectedStock.details.weekPrior}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">RSI</div>
                  <div className="modal-val" style={{color: '#fff'}}>{selectedStock.details.rsi}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">Vol Spike</div>
                  <div className="modal-val" style={{color: '#fff'}}>{selectedStock.details.volSpike}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">Target Upside</div>
                  <div className="modal-val">{selectedStock.details.targetUpside}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">Rel Strength</div>
                  <div className="modal-val">{selectedStock.details.relStrength}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">FCF Yield %</div>
                  <div className="modal-val">{selectedStock.details.fcfYield}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">PE Ratio</div>
                  <div className="modal-val" style={{color: '#fff'}}>{selectedStock.details.peRatio}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">PEG Ratio</div>
                  <div className="modal-val" style={{color: '#fff'}}>{selectedStock.details.pegRatio}</div>
                </div>
                <div className="modal-item">
                  <div className="modal-label">Forest Verified</div>
                  <div className="modal-val" style={{color: '#3ecf72'}}>{selectedStock.details.forestVerified}</div>
                </div>
              </div>
              <button className="btn active" style={{width: '100%', marginTop: '20px', padding: '12px'}} onClick={() => setSelectedStock(null)}>Close Details</button>
            </div>
          </div>
        )}

      </div>

      <footer>
        Note: This is not financial advice.<br/>
        "Quick Read" text is generated from recorded metrics only — it is not a prediction or a grade.
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
