<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sowers Money Movers</title>
  <!-- Google Font: JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #0f0f12; color: #e8e8e8; font-family: 'JetBrains Mono', monospace; margin: 0; padding-bottom: 20px; }
    .hero { padding: 30px; background: #12121a; border-bottom: 1px solid #2a2a3a; text-align: center; position: relative; }
    .logo { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); height: 48px; width: 48px; object-fit: contain; border-radius: 6px; }
    .status { font-size: 11px; font-weight: bold; margin-top: 10px; text-transform: uppercase; color: #f5a623; letter-spacing: 1px; }
    .tabs { display: flex; justify-content: center; background: #12121a; border-bottom: 1px solid #2a2a3a; position: sticky; top: 0; z-index: 10; }
    .tab { padding: 15px 25px; cursor: pointer; color: #666; font-weight: bold; transition: 0.3s; }
    .tab.active { color: #f5a623; border-bottom: 3px solid #f5a623; }
    .container { padding: 20px; max-width: 900px; margin: 0 auto; min-height: calc(100vh - 250px); }
    .stats-header-banner { background: #1a1a2e; border: 1px solid #333; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: 800; font-size: 12px; color: #f5a623; letter-spacing: 1px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #161620; padding: 20px 10px; border-radius: 15px; border: 1px solid #2a2a3a; text-align: center; }
    .stat-label { font-size: 10px; color: #777; text-transform: uppercase; font-weight: 800; margin-bottom: 5px; }
    .stat-value { font-size: 18px; font-weight: 800; margin-top: 10px; color: #f5a623; }
    .donut-ring { width: 70px; height: 70px; margin: 10px auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
    .search-box { width: 100%; padding: 12px; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; color: #fff; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; font-family: 'JetBrains Mono', monospace; }
    .day-btns { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .btn { padding: 8px 18px; border-radius: 20px; background: #1a1a2e; color: #888; border: 1px solid #333; cursor: pointer; font-weight: bold; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
    .btn.active { background: #f5a623; color: #000; border-color: #f5a623; }
    table { width: 100%; border-collapse: collapse; background: #161620; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a3a; margin-bottom: 25px; }
    th { text-align: left; padding: 12px; background: #1e1e2e; color: #666; font-size: 11px; text-transform: uppercase; }
    td { padding: 15px 12px; border-bottom: 1px solid #2a2a3a; font-size: 14px; }
    .ticker { font-weight: 800; color: #fff; }
    .score-cell { font-weight: bold; color: #f5a623; }
    .price-cell { font-weight: bold; color: #e8e8e8; }
    .section-header { color: #f5a623; font-size: 14px; font-weight: 800; margin: 25px 0 10px 0; text-transform: uppercase; }
    .pos { color: #3ecf72; } .neg { color: #e85555; } .neutral { color: #888; }
    select { width: 100%; padding: 15px; background: #1a1a2e; color: #fff; border: 1px solid #f5a623; border-radius: 8px; font-size: 16px; margin-bottom: 15px; font-weight: bold; font-family: 'JetBrains Mono', monospace; }
    footer { text-align: center; color: #555; font-size: 11px; padding: 20px; border-top: 1px solid #1e1e2e; margin-top: 40px; }
    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr; }
      .logo { position: static; transform: none; margin: 0 auto 10px auto; display: block; }
      .hero { text-align: center; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSkJGrxSTkCk88LMTiTgSRmvP_tf37HyeZWnsXl3sKNF9ESDdmUp1R9vCODEqej6qcXw/exec";

function App() {
  const [data, setData] = useState([]);
  const [dates, setDates] = useState([]);
  const [selectedDate, setSelectedDate] = useState('');
  const [dayIdx, setDayIdx] = useState(0); 
  const [search, setSearch] = useState('');
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('tracker');

  useEffect(() => {
    fetch(SCRIPT_URL)
      .then(res => res.text())
      .then(text => {
        const cleanText = text.trim();
        if (cleanText.startsWith("Error:") || cleanText.startsWith("<")) {
          throw new Error("Invalid CSV data received from Apps Script. Verify Google Sheet URL.");
        }
        
        const rows = cleanText.split(/\r?\n/).map(line => 
          line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim())
        );

        const parsed = rows.slice(1).map(r => {
          const rawWin = r[40] ? r[40].replace(/[^0-9.]/g, '') : ''; // Column AO (Index 40)
          let winStatus = null;
          if (rawWin === '1' || rawWin === '1.0' || rawWin === '100') {
            winStatus = 1;
          } else if (rawWin === '0' || rawWin === '0.0') {
            winStatus = 0;
          }

          return {
            date: r[0] ? r[0].trim() : '', 
            ticker: r[1] || '', 
            score: parseFloat(r[47]) || 0, // Column AV (Index 47)
            winVal: winStatus, 
            prices: [
              parseFloat(r[14]) || 0, 
              parseFloat(r[16]) || 0, 
              parseFloat(r[20]) || 0, 
              parseFloat(r[24]) || 0, 
              parseFloat(r[28]) || 0, 
              parseFloat(r[32]) || 0
            ],
            growths: [
              parseFloat(r[15]) || 0, 
              parseFloat(r[17]) || 0, 
              parseFloat(r[21]) || 0, 
              parseFloat(r[25]) || 0, 
              parseFloat(r[29]) || 0, 
              parseFloat(r[33]) || 0
            ]
          };
        });

        const uniqueDates = [...new Set(parsed.map(r => r.date))].filter(Boolean).reverse();
        setData(parsed);
        setDates(uniqueDates);
        if (uniqueDates.length > 0) setSelectedDate(uniqueDates[0]);
      })
      .catch(err => {
        console.error("Fetch failure:", err);
        alert(err.message);
      })
      .finally(() => setLoading(false));
  }, []);

  const rankedAllForDate = useMemo(() => {
    const dayData = data.filter(r => r.date === selectedDate);
    return [...dayData].sort((a, b) => b.score - a.score).map((item, idx) => ({
      ...item,
      rank: idx + 1
    }));
  }, [data, selectedDate]);

  const historyStats = useMemo(() => {
    let topWins = 0, topLosses = 0;
    let botWins = 0, botLosses = 0;
    let remWins = 0, remLosses = 0;

    dates.forEach(d => {
      const dayData = data.filter(r => r.date === d).sort((a, b) => b.score - a.score);
      if (dayData.length === 0) return;

      const top25Tickers = new Set(dayData.slice(0, 25).map(r => r.ticker));
      const bot25Tickers = new Set(dayData.slice(-25).map(r => r.ticker));

      dayData.forEach(r => {
        if (r.winVal === null) return; // Skip unrecorded or missing win metrics

        if (top25Tickers.has(r.ticker)) {
          if (r.winVal === 1) topWins++; else topLosses++;
        } else if (bot25Tickers.has(r.ticker)) {
          if (r.winVal === 1) botWins++; else botLosses++;
        } else {
          if (r.winVal === 1) remWins++; else remLosses++;
        }
      });
    });

    const calcRate = (w, l) => (w + l > 0 ? Math.round((w / (w + l)) * 100) : 0);

    return {
      topRate: calcRate(topWins, topLosses),
      topRecord: `${topWins}-${topLosses}`,
      botRate: calcRate(botWins, botLosses),
      botRecord: `${botWins}-${botLosses}`,
      remRate: calcRate(remWins, remLosses),
      remRecord: `${remWins}-${remLosses}`
    };
  }, [data, dates]);

  const top25 = useMemo(() => rankedAllForDate.slice(0, 25), [rankedAllForDate]);
  const bottom25 = useMemo(() => [...rankedAllForDate].reverse().slice(0, 25), [rankedAllForDate]);
  
  const searchResults = useMemo(() => {
    return rankedAllForDate
      .filter(r => r.ticker.toLowerCase().includes(search.toLowerCase()))
      .map(s => {
        const entryP = s.prices[0];
        const friP = s.prices[5];
        let netReturn = 0;
        let hasData = false;
        
        if (entryP > 0 && friP > 0) {
          netReturn = ((friP - entryP) / entryP) * 100;
          hasData = true;
        }
        return { ...s, netReturn, hasData };
      });
  }, [rankedAllForDate, search]);

  if (loading) return <div className="hero"><h1>Sowers Money Movers</h1><div className="status">SYNCING...</div></div>;

  return (
    <div>
      <div className="hero">
        <img src="logo.png" alt="Money Movers Logo" className="logo" />
        <h1 style={{margin: 0, fontSize: '24px'}}>Sowers Money Movers</h1>
        <div className="status">{selectedDate} ANALYSIS</div>
      </div>

      <div className="tabs">
        <div className={`tab ${view === 'tracker' ? 'active' : ''}`} onClick={() => setView('tracker')}>TRACKER</div>
        <div className={`tab ${view === 'history' ? 'active' : ''}`} onClick={() => setView('history')}>RECORD</div>
        <div className={`tab ${view === 'search' ? 'active' : ''}`} onClick={() => setView('search')}>SEARCH</div>
        <div className={`tab ${view === 'settings' ? 'active' : ''}`} onClick={() => setView('settings')}>CONFIG</div>
      </div>

      <div className="container">
        
        {view === 'tracker' && (
          <div className="day-btns">
              {['Entry', 'Mon','Tue','Wed','Thu','Fri'].map((d, i) => (
                <button key={d} className={`btn ${dayIdx === i ? 'active' : ''}`} onClick={() => setDayIdx(i)}>{d}</button>
              ))}
          </div>
        )}

        {view === 'history' ? (
          <div>
            <div className="stats-header-banner">
              OVERALL WIN-LOSS RECORDS (ALL HISTORICAL DATES)
            </div>

            <div className="stats-grid">
              <div className="stat-card">
                <div className="stat-label">Top 25 Ranked</div>
                <div className="donut-ring" style={{background: `conic-gradient(#3ecf72 ${historyStats.topRate}%, #222 0)`}}>
                  <div style={{background:'#161620', width:'80%', height:'80%', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center'}}>
                    {historyStats.topRate}%
                  </div>
                </div>
                <div className="stat-value">{historyStats.topRecord}</div>
              </div>

              <div className="stat-card">
                <div className="stat-label">Bottom 25 Ranked</div>
                <div className="donut-ring" style={{background: `conic-gradient(#e85555 ${historyStats.botRate}%, #222 0)`}}>
                  <div style={{background:'#161620', width:'80%', height:'80%', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center'}}>
                    {historyStats.botRate}%
                  </div>
                </div>
                <div className="stat-value" style={{color: '#e85555'}}>{historyStats.botRecord}</div>
              </div>

              <div className="stat-card">
                <div className="stat-label">Remaining Field</div>
                <div className="donut-ring" style={{background: `conic-gradient(#555 ${historyStats.remRate}%, #222 0)`}}>
                  <div style={{background:'#161620', width:'80%', height:'80%', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center'}}>
                    {historyStats.remRate}%
                  </div>
                </div>
                <div className="stat-value" style={{color: '#888'}}>{historyStats.remRecord}</div>
              </div>
            </div>

            <div className="section-header">Top 25 Performers ({selectedDate})</div>
            <table>
              <thead>
                <tr>
                  <th>Ticker</th>
                  <th>Rank</th>
                  <th>Score (AV)</th>
                  <th>Entry</th>
                  <th>Finished</th>
                  <th style={{textAlign:'right'}}>Weekly Win</th>
                </tr>
              </thead>
              <tbody>
                {top25.map((s, i) => (
                  <tr key={i}>
                    <td className="ticker">{s.ticker}</td>
                    <td style={{fontSize: '12px', color: '#888'}}>#{s.rank}</td>
                    <td className="score-cell">{!isNaN(s.score) ? s.score.toFixed(2) : '--'}</td>
                    <td className="price-cell">{s.prices[0] ? `$${s.prices[0].toFixed(2)}` : '--'}</td>
                    <td className="price-cell">{s.prices[5] ? `$${s.prices[5].toFixed(2)}` : '--'}</td>
                    <td style={{textAlign:'right'}} className={s.winVal === 1 ? 'pos' : s.winVal === 0 ? 'neg' : 'neutral'}>
                      {s.winVal === 1 ? 'WIN (1)' : s.winVal === 0 ? 'LOSS (0)' : '--'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="section-header">Bottom 25 Performers ({selectedDate})</div>
            <table>
              <thead>
                <tr>
                  <th>Ticker</th>
                  <th>Rank</th>
                  <th>Score (AV)</th>
                  <th>Entry</th>
                  <th>Finished</th>
                  <th style={{textAlign:'right'}}>Weekly Win</th>
                </tr>
              </thead>
              <tbody>
                {bottom25.map((s, i) => (
                  <tr key={i}>
                    <td className="ticker">{s.ticker}</td>
                    <td style={{fontSize: '12px', color: '#888'}}>#{s.rank}</td>
                    <td className="score-cell">{!isNaN(s.score) ? s.score.toFixed(2) : '--'}</td>
                    <td className="price-cell">{s.prices[0] ? `$${s.prices[0].toFixed(2)}` : '--'}</td>
                    <td className="price-cell">{s.prices[5] ? `$${s.prices[5].toFixed(2)}` : '--'}</td>
                    <td style={{textAlign:'right'}} className={s.winVal === 1 ? 'pos' : s.winVal === 0 ? 'neg' : 'neutral'}>
                      {s.winVal === 1 ? 'WIN (1)' : s.winVal === 0 ? 'LOSS (0)' : '--'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : view === 'search' ? (
          <div>
            <input className="search-box" placeholder="Search ticker history..." value={search} onChange={e => setSearch(e.target.value)} />
            <table>
              <thead>
                <tr>
                  <th>Ticker</th>
                  <th>Category</th>
                  <th style={{textAlign:'right'}}>Weekly Net</th>
                </tr>
              </thead>
              <tbody>
                {searchResults.map((s, i) => (
                  <tr key={i}>
                    <td className="ticker">{s.ticker}</td>
                    <td style={{fontSize: '12px', color: '#888'}}>Ranked #{s.rank}</td>
                    <td style={{textAlign:'right'}} className={!s.hasData ? 'neutral' : s.netReturn >= 0 ? 'pos' : 'neg'}>
                      {s.hasData ? `${s.netReturn.toFixed(2)}%` : '--'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        ) : view === 'settings' ? (
          <div>
            <h3 style={{marginTop: 0}}>Switch Analysis Date</h3>
            <select value={selectedDate} onChange={e => setSelectedDate(e.target.value)}>{dates.map(d => <option key={d}>{d}</option>)}</select>
          </div>
        ) : (
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Ticker</th>
                <th>Score</th>
                <th>Price</th>
                {dayIdx !== 0 && <th style={{textAlign:'right'}}>Growth</th>}
              </tr>
            </thead>
            <tbody>
              {rankedAllForDate.map((s) => (
                <tr key={s.ticker}>
                  <td style={{color:'#f5a623', fontWeight:'bold'}}>#{s.rank}</td>
                  <td className="ticker">{s.ticker}</td>
                  <td className="score-cell">{!isNaN(s.score) ? s.score.toFixed(2) : '--'}</td>
                  <td className="price-cell">{s.prices[dayIdx] ? `$${s.prices[dayIdx].toFixed(2)}` : '--'}</td>
                  {dayIdx !== 0 && (
                    <td style={{textAlign:'right'}} className={s.growths[dayIdx] >= 0 ? 'pos' : 'neg'}>
                      {s.growths[dayIdx].toFixed(2)}%
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <footer>
        Note: This is not financial advice
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
